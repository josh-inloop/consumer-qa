appId: com.talos.app
---

# Launch app fresh and log in via OTP as the newbie user
- launchApp:
    clearState: true
- tapOn:
    id: "PhoneInput"
- waitForAnimationToEnd

# Dismiss Google phone number autofill dialog if it appears
- runFlow:
    when:
      visible: "Choose a phone number"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd

- eraseText: 20
- inputText: "${E2E_PHONE_PART1}"
- waitForAnimationToEnd
- inputText: "${E2E_PHONE_PART2}"
- waitForAnimationToEnd
- inputText: "${E2E_PHONE_PART3}"
- waitForAnimationToEnd

# Dismiss Google phone number autofill dialog if it appears after input
- runFlow:
    when:
      visible: "Choose a phone number"
    commands:
      - pressKey: Back
      - waitForAnimationToEnd

- pressKey: Enter
- waitForAnimationToEnd

- tapOn:
    below:
      text: "Enter the verification code below"
- inputText: "${E2E_OTP}"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "swipableAdvertisement_close"
    timeout: 12000
    optional: true
- runFlow:
    when:
      visible:
        id: "swipableAdvertisement_close"
    commands:
      - tapOn:
          id: "swipableAdvertisement_close"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Search"
    timeout: 30000
- stopApp
