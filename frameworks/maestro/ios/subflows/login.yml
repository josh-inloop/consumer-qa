appId: com.talos.app
---

# Launch app fresh and log in via OTP
- launchApp:
    clearState: true
- tapOn:
    text: "Ask App Not to Track"
    optional: true
- tapOn:
    id: "PhoneInput"
- waitForAnimationToEnd
# Enter the number as raw digits in chunks — dash characters scramble the masked field and
# sending all digits at once can drop the country code. Auto-submit was removed from the new
# login flow, so press Enter to advance to the verification step once the number is complete.
- inputText: "${E2E_PHONE_PART1}"
- waitForAnimationToEnd
- inputText: "${E2E_PHONE_PART2}"
- waitForAnimationToEnd
- inputText: "${E2E_PHONE_PART3}"
- waitForAnimationToEnd
- pressKey: Enter
- waitForAnimationToEnd

# Verification code: six boxes backed by a single input (no id). Tap the row to focus it,
# then type the code; the screen auto-submits once the sixth digit lands.
- tapOn:
    point: "50%,32%"
- inputText: "${E2E_OTP}"
- waitForAnimationToEnd

# A "Talos AI" promo sheet animates in over home a beat after login and covers the
# search bar. Dismiss it BEFORE asserting home — asserting "Search" first races the
# slide-in and fails behind the sheet. Both steps are tolerant: when the sheet never
# shows, the optional wait expires and the dismiss is a no-op.
- extendedWaitUntil:
    visible:
      id: "swipableAdvertisement_close"
    timeout: 12000
    optional: true
- runFlow: dismiss-home-modals.yml

# Wait for home screen to confirm login succeeded
- extendedWaitUntil:
    visible: "Search"
    timeout: 30000

# Guard against address drift from a prior suite (e.g. Newbie leaving Miami)
- runFlow:
    file: set-address.yml
    env:
      TARGET_ADDRESS: "12 Manley"
