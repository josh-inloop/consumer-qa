name: Maestro Talos AI iOS Production US

on:
  schedule:
    - cron: "35 7 * * *"  # 3:35 AM EDT (summer) — change to "35 8 * * *" for 3:35 AM EST (winter)
  workflow_dispatch:
    inputs:
      app_artifact_name:
        description: "App artifact name from the ios-production workflow"
        required: true
        default: "talos-ios-simulator"
      run_moments:
        description: "Run Talos AI Moments test"
        type: boolean
        default: true
      run_ama:
        description: "Run Talos AI AMA test"
        type: boolean
        default: true
      run_checkout:
        description: "Run Talos AI Checkout test"
        type: boolean
        default: true
      run_product_detail:
        description: "Run Talos AI Product Detail test"
        type: boolean
        default: true

concurrency:
  group: maestro-talos-ai-ios-production-us
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ios-talos-ai-us:
    name: "Maestro Talos AI iOS Production US"
    runs-on: self-hosted-macos
    timeout-minutes: 70

    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      duration: ${{ steps.summary.outputs.duration }}
      platform: ${{ steps.summary.outputs.platform }}
      build_version: ${{ steps.summary.outputs.build_version }}

    env:
      APP_REPO_TOKEN: ${{ secrets.APP_REPO_ACCESS }}
      TARGET_REPO: ${{ secrets.TARGET_REPO }}
      MAESTRO_CLI_NO_ANALYTICS: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RUN_MOMENTS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_moments }}
      RUN_AMA: ${{ github.event_name != 'workflow_dispatch' || inputs.run_ama }}
      RUN_CHECKOUT: ${{ github.event_name != 'workflow_dispatch' || inputs.run_checkout }}
      RUN_PRODUCT_DETAIL: ${{ github.event_name != 'workflow_dispatch' || inputs.run_product_detail }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record start time
        run: date +%s > job-start.txt

      - name: Pre-run cleanup
        run: |
          pkill -f "maestro" || true
          xcrun simctl shutdown all || true
          pkill -f "CoreSimulatorService" || true
          pkill -f "SimAudioProcessorService" || true
          pkill -f "SimStreamProcessorService" || true
          pkill -f "SimulatorTrampoline" || true
          pkill -f "SimLaunchHost" || true
          rm -rf ~/.maestro/tests/ ~/.maestro/tests-auth/ || true

      - name: Ensure GitHub CLI and ffmpeg are installed
        run: |
          if ! command -v gh &>/dev/null; then
            brew install gh
          fi
          if ! command -v ffmpeg &>/dev/null; then
            brew install ffmpeg
          fi

      - name: Download simulator .app from latest ios-production run
        env:
          GH_TOKEN: ${{ env.APP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="${{ inputs.app_artifact_name || 'talos-ios-simulator' }}"
          # gh run list --status success can filter against a lagging search
          # index and return a run that's months stale. Filter conclusion via
          # jq against the unfiltered (always-fresh) listing instead.
          RUN_ID=$(gh run list \
            --repo "$TARGET_REPO" \
            --workflow ios-production.yml \
            --limit 30 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful ios-production runs found for $TARGET_REPO"
            exit 1
          fi
          echo "Downloading $ARTIFACT_NAME from latest app-repo run $RUN_ID"
          if ! gh run download "$RUN_ID" \
            --repo "$TARGET_REPO" \
            --name "$ARTIFACT_NAME" \
            --dir app/; then
            echo "::error::The latest successful ios-production run ($RUN_ID) has no $ARTIFACT_NAME artifact. Refusing to fall back to an older build; the app-repo iOS production build needs attention."
            exit 1
          fi
          unzip app/talos-ios-simulator.zip -d app/
          APP_PATH=$(find app/ -name "Talos.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.6.1
          if ! "$HOME/.maestro/bin/maestro" --version 2>/dev/null | grep -q "2.6.1"; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        timeout-minutes: 10
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 17 Pro Max" | head -1 | grep -oE '\([A-F0-9-]{36}\)' | tr -d '()')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '\([A-F0-9-]{36}\)' | tr -d '()')
          fi
          echo "Booting simulator: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          SIMULATOR_PLATFORM=$(xcrun simctl list devices --json | python3 -c "import json,sys; data=json.load(sys.stdin); udid=sys.argv[1]; result=[d['name']+' Simulator, iOS '+rt.split('iOS-')[-1].replace('-','.') for rt,devs in data['devices'].items() for d in devs if d.get('udid')==udid and 'iOS-' in rt]; print(result[0] if result else 'iPhone Simulator, iOS')" "$UDID" 2>/dev/null || echo "iPhone Simulator, iOS")
          echo "SIMULATOR_PLATFORM=$SIMULATOR_PLATFORM" >> "$GITHUB_ENV"

      - name: Install app on simulator
        run: xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Run Maestro tests
        timeout-minutes: 55
        run: |
          run_maestro_with_retry() {
            log_file="$1"; shift
            timeout --kill-after=10s 480 maestro test "$@" 2>&1 | tee "$log_file" || true
            if grep -qE "device offline|UNAVAILABLE|Not able to reach|DEADLINE_EXCEEDED|waiting_for_connection|Unable to launch app" "$log_file" 2>/dev/null; then
              echo "Device lost gRPC connection — retrying..."
              sleep 5
              timeout --kill-after=10s 480 maestro test "$@" 2>&1 | tee "$log_file" || true
            fi
          }
          # simctl's own recording has no clip-length cap (unlike adb
          # screenrecord), so no segment-looping needed — just start/SIGINT.
          rec_start() {
            name="$1"
            xcrun simctl io "$SIMULATOR_UDID" recordVideo --force "recordings-tmp-${name}.mp4" >"/tmp/record-${name}.log" 2>&1 &
            echo $! > "/tmp/record-${name}.pid"
            sleep 1
          }
          # Only kept when keep=true, i.e. the suite this bracketed actually
          # failed — passing runs get nothing.
          rec_stop() {
            name="$1"; keep="$2"
            pid=$(cat "/tmp/record-${name}.pid" 2>/dev/null || true)
            if [ -n "$pid" ]; then
              kill -INT "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null
            fi
            if [ "$keep" = "true" ] && [ -f "recordings-tmp-${name}.mp4" ]; then
              mkdir -p "recordings/${name}"
              # simctl's native capture is large (full device resolution,
              # lightly compressed) — recompress since this only runs on an
              # already-failing suite, never on a passing one.
              if command -v ffmpeg &>/dev/null && ffmpeg -y -i "recordings-tmp-${name}.mp4" -vf "scale=-2:720" -c:v libx264 -crf 28 -preset veryfast -c:a aac -b:a 64k "recordings/${name}/${name}.mp4" 2>/dev/null; then
                rm -f "recordings-tmp-${name}.mp4"
              else
                mv "recordings-tmp-${name}.mp4" "recordings/${name}/" 2>/dev/null || true
              fi
            else
              rm -f "recordings-tmp-${name}.mp4"
            fi
            rm -f "/tmp/record-${name}.pid"
          }
          if [ "$RUN_MOMENTS" = "true" ] || [ "$RUN_AMA" = "true" ] || [ "$RUN_CHECKOUT" = "true" ] || [ "$RUN_PRODUCT_DETAIL" = "true" ]; then
            timeout 300 maestro test frameworks/maestro/ios/subflows/login.yml || true
          fi
          if [ "$RUN_MOMENTS" = "true" ]; then
            rec_start moments
            run_maestro_with_retry maestro-talos-ai-moments.txt --format junit --output report-talos-ai-moments.xml frameworks/maestro/talos-ai/ios/ios-talos-ai-moments.yml
            if [ -f report-talos-ai-moments.xml ]; then python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('report-talos-ai-moments.xml').getroot(); s=root.findall('testsuite') if root.tag=='testsuites' else [root]; exit(1 if sum(int(x.get('failures',0))+int(x.get('errors',0)) for x in s) else 0)" 2>/dev/null || touch moments-failed; else touch moments-failed; fi
            rec_stop moments "$([ -f moments-failed ] && echo true || echo false)"
          fi
          if [ "$RUN_AMA" = "true" ]; then
            rec_start ama
            run_maestro_with_retry maestro-talos-ai-ama.txt --format junit --output report-talos-ai-ama.xml frameworks/maestro/talos-ai/ios/ios-talos-ai-ama.yml
            if [ -f report-talos-ai-ama.xml ]; then python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('report-talos-ai-ama.xml').getroot(); s=root.findall('testsuite') if root.tag=='testsuites' else [root]; exit(1 if sum(int(x.get('failures',0))+int(x.get('errors',0)) for x in s) else 0)" 2>/dev/null || touch ama-failed; else touch ama-failed; fi
            rec_stop ama "$([ -f ama-failed ] && echo true || echo false)"
          fi
          if [ "$RUN_CHECKOUT" = "true" ]; then
            rec_start checkout
            run_maestro_with_retry maestro-talos-ai-checkout.txt --format junit --output report-talos-ai-checkout.xml frameworks/maestro/talos-ai/ios/ios-talos-ai-checkout.yml
            if [ -f report-talos-ai-checkout.xml ]; then python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('report-talos-ai-checkout.xml').getroot(); s=root.findall('testsuite') if root.tag=='testsuites' else [root]; exit(1 if sum(int(x.get('failures',0))+int(x.get('errors',0)) for x in s) else 0)" 2>/dev/null || touch checkout-failed; else touch checkout-failed; fi
            rec_stop checkout "$([ -f checkout-failed ] && echo true || echo false)"
          fi
          if [ "$RUN_PRODUCT_DETAIL" = "true" ]; then
            rec_start product-detail
            run_maestro_with_retry maestro-talos-ai-product-detail.txt --format junit --output report-talos-ai-product-detail.xml frameworks/maestro/talos-ai/ios/ios-talos-ai-product-detail.yml
            if [ -f report-talos-ai-product-detail.xml ]; then python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('report-talos-ai-product-detail.xml').getroot(); s=root.findall('testsuite') if root.tag=='testsuites' else [root]; exit(1 if sum(int(x.get('failures',0))+int(x.get('errors',0)) for x in s) else 0)" 2>/dev/null || touch product-detail-failed; else touch product-detail-failed; fi
            rec_stop product-detail "$([ -f product-detail-failed ] && echo true || echo false)"
          fi

      - name: Publish test summary
        id: summary
        if: always()
        env:
          APP_PATH: ${{ env.APP_PATH }}
          SIMULATOR_PLATFORM: ${{ env.SIMULATOR_PLATFORM }}
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET, os, glob, sys, re, json, time, subprocess

          labels = {
              "report-talos-ai-moments.xml":        "Talos AI Moments",
              "report-talos-ai-ama.xml":            "Talos AI AMA",
              "report-talos-ai-checkout.xml":        "Talos AI Checkout",
              "report-talos-ai-product-detail.xml":  "Talos AI Product Detail",
          }

          label_to_flow = {
              "Talos AI Moments":        "ios-talos-ai-moments",
              "Talos AI AMA":            "ios-talos-ai-ama",
              "Talos AI Checkout":       "ios-talos-ai-checkout",
              "Talos AI Product Detail": "ios-talos-ai-product-detail",
          }

          label_to_txt = {
              "Talos AI Moments":        "maestro-talos-ai-moments.txt",
              "Talos AI AMA":            "maestro-talos-ai-ama.txt",
              "Talos AI Checkout":       "maestro-talos-ai-checkout.txt",
              "Talos AI Product Detail": "maestro-talos-ai-product-detail.txt",
          }

          log_errors = {}
          _log_paths = (
              sorted(glob.glob(os.path.expanduser("~/.maestro/tests-auth/*/maestro.log"))) +
              sorted(glob.glob(os.path.expanduser("~/.maestro/tests/*/maestro.log")))
          )
          _skip_steps = {'Define variables', 'Apply configuration'}
          for log_path in _log_paths:
              flow_name = None
              completed = []
              pending_error = None
              errors = []
              try:
                  with open(log_path) as f:
                      for line in f:
                          fm = re.search(r'Running flow (\S+)', line)
                          if fm:
                              flow_name = re.sub(r'\.yml.*$', '', fm.group(1)).rsplit('/', 1)[-1]
                              completed = []
                              errors = []
                              pending_error = None
                              continue
                          comp_m = re.search(r'MaestroCommandRunner\.runCommands\S+:\s*(.+?)\s+COMPLETED', line)
                          if comp_m:
                              step = comp_m.group(1).strip()
                              if step not in _skip_steps:
                                  completed.append(step)
                                  if len(completed) > 4:
                                      completed.pop(0)
                              continue
                          cmd_m = re.search(r'\[Command execution\] CommandFailed:\s*(.+)', line)
                          if cmd_m:
                              pending_error = cmd_m.group(1).strip()
                              continue
                          failed_m = re.search(r'MaestroCommandRunner\.runCommands\S+:\s*(.+?)\s+FAILED', line)
                          if failed_m:
                              failed_step = failed_m.group(1).strip()
                              entry = [f"  ✓ {s}" for s in completed]
                              if pending_error and not pending_error.startswith('Assertion is false:'):
                                  entry.append(f"  ✗ {failed_step} — {pending_error}")
                              else:
                                  entry.append(f"  ✗ {failed_step}")
                              errors.append("\n".join(entry))
                              pending_error = None
              except Exception:
                  pass
              if pending_error and not errors:
                  errors.append(f"  ✗ {pending_error}")
              if flow_name and errors:
                  log_errors.setdefault(flow_name, []).extend(errors)

          summary_rows = []
          failure_sections = []
          any_failures = False
          total_passed_all = 0
          total_failed_all = 0

          for path in sorted(glob.glob("report-*.xml")):
              label = labels.get(path, path)
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue

              suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
              total = failures = skipped = errors = 0
              for s in suites:
                  total    += int(s.get("tests",    0))
                  failures += int(s.get("failures", 0))
                  skipped  += int(s.get("skipped",  0))
                  errors   += int(s.get("errors",   0))
              if total == 0:
                  total    = sum(1 for _ in root.iter("testcase"))
                  failures = sum(1 for tc in root.iter("testcase") if tc.find("failure") is not None)
                  errors   = sum(1 for tc in root.iter("testcase") if tc.find("error")   is not None)
              passed = total - failures - skipped - errors
              total_passed_all += passed
              total_failed_all += failures + errors

              if failures + errors > 0:
                  any_failures = True
                  status = "❌"
              else:
                  status = "✅"

              summary_rows.append(f"| {status} {label} | {passed} | {failures + errors} | {skipped} |")

              failure_details = []
              if failures + errors > 0:
                  txt_file = label_to_txt.get(label, "")
                  txt_msgs = []
                  if txt_file:
                      try:
                          with open(txt_file) as f:
                              for line in f:
                                  m = re.search(r'\[Failed\]\s+\S+\s+\([^)]+\)\s+\((.+)\)\s*$', line.strip())
                                  if m:
                                      txt_msgs.append(m.group(1))
                      except Exception:
                          pass
                  if txt_msgs:
                      failure_details.append("```\n" + "\n".join(f"  ✗ {msg}" for msg in txt_msgs) + "\n```")
                  else:
                      flow = label_to_flow.get(label, "")
                      log_msgs = log_errors.get(flow, [])
                      if log_msgs:
                          failure_details.append("```\n" + "\n\n".join(log_msgs) + "\n```")
                      else:
                          failure_details.append(f"{failures + errors} test(s) failed (no details available)")

              failure_details = list(dict.fromkeys(failure_details))
              if failure_details:
                  body = "\n\n".join(failure_details)
                  failure_sections.append(
                      f"<details>\n<summary>❌ {label} — Failures</summary>\n\n{body}\n\n</details>"
                  )

          # A suite that was enabled but never wrote a report (e.g. maestro hung
          # and was killed by run_maestro_with_retry's timeout) must count as a
          # failure here too — otherwise it's silently absent from summary_rows
          # and any_failures stays False, reporting a run that tested nothing as
          # a full pass (TALOS Talos AI iOS checkout silent-success incident,
          # 2026-11-13).
          expected_reports = {
              "report-talos-ai-moments.xml":        os.environ.get("RUN_MOMENTS") == "true",
              "report-talos-ai-ama.xml":             os.environ.get("RUN_AMA") == "true",
              "report-talos-ai-checkout.xml":        os.environ.get("RUN_CHECKOUT") == "true",
              "report-talos-ai-product-detail.xml":  os.environ.get("RUN_PRODUCT_DETAIL") == "true",
          }
          seen_reports = set(glob.glob("report-*.xml"))
          for path, should_run in expected_reports.items():
              if should_run and path not in seen_reports:
                  label = labels[path]
                  any_failures = True
                  total_failed_all += 1
                  summary_rows.append(f"| ❌ {label} | 0 | 1 | 0 |")
                  failure_sections.append(
                      f"<details>\n<summary>❌ {label} — Failures</summary>\n\n"
                      f"```\n  ✗ Suite crashed or hung before writing a report ({path} missing)\n```\n\n</details>"
                  )

          lines = [
              "## Test Summary", "",
              "| Suite | ✅ Passed | ❌ Failed | ⏭️ Skipped |",
              "|---|---|---|---|",
          ]
          lines.extend(summary_rows or ["| — | — | — | — |"])
          if failure_sections:
              lines.append("")
              lines.extend(failure_sections)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")

          try:
              with open("job-start.txt") as f:
                  elapsed = int(time.time()) - int(f.read().strip())
              mins, secs = divmod(elapsed, 60)
              duration = f"{mins}m {secs}s" if mins else f"{secs}s"
          except Exception:
              duration = "—"

          platform = os.environ.get("SIMULATOR_PLATFORM", "iPhone Simulator, iOS")
          build_version = ""
          app_path = os.environ.get("APP_PATH", "")
          if app_path:
              try:
                  ver = subprocess.check_output(
                      ["/usr/libexec/PlistBuddy", "-c", "Print :CFBundleShortVersionString",
                       f"{app_path}/Info.plist"], stderr=subprocess.DEVNULL
                  ).decode().strip()
                  build = subprocess.check_output(
                      ["/usr/libexec/PlistBuddy", "-c", "Print :CFBundleVersion",
                       f"{app_path}/Info.plist"], stderr=subprocess.DEVNULL
                  ).decode().strip()
                  if ver and build:
                      build_version = f"v{ver} ({build})"
              except Exception:
                  pass

          with open(os.environ["GITHUB_OUTPUT"], "a") as go:
              go.write(f"passed={total_passed_all}\n")
              go.write(f"failed={total_failed_all}\n")
              go.write(f"duration={duration}\n")
              go.write(f"platform={platform}\n")
              go.write(f"build_version={build_version}\n")

          sys.exit(1 if any_failures else 0)
          EOF

      - name: Upload Moments suite artifacts
        if: always() && hashFiles('moments-failed') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-talos-ai-ios-us-moments-artifacts
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Moments suite recording
        if: always() && hashFiles('moments-failed') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-talos-ai-ios-us-moments-recording
          path: recordings/moments/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AMA suite artifacts
        if: always() && hashFiles('ama-failed') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-talos-ai-ios-us-ama-artifacts
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AMA suite recording
        if: always() && hashFiles('ama-failed') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-talos-ai-ios-us-ama-recording
          path: recordings/ama/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Checkout suite artifacts
        if: always() && hashFiles('checkout-failed') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-talos-ai-ios-us-checkout-artifacts
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Checkout suite recording
        if: always() && hashFiles('checkout-failed') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-talos-ai-ios-us-checkout-recording
          path: recordings/checkout/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Product Detail suite artifacts
        if: always() && hashFiles('product-detail-failed') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-talos-ai-ios-us-product-detail-artifacts
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Product Detail suite recording
        if: always() && hashFiles('product-detail-failed') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-talos-ai-ios-us-product-detail-recording
          path: recordings/product-detail/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write daily results artifact
        if: always()
        env:
          PASSED: ${{ steps.summary.outputs.passed }}
          FAILED: ${{ steps.summary.outputs.failed }}
          DURATION: ${{ steps.summary.outputs.duration }}
          BUILD_VERSION: ${{ steps.summary.outputs.build_version }}
          OUTCOME: ${{ steps.summary.outcome }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          python3 << 'PYEOF'
          import json, os, xml.etree.ElementTree as ET, glob
          labels = {
              "report-talos-ai-moments.xml":        "Talos AI Moments",
              "report-talos-ai-ama.xml":            "Talos AI AMA",
              "report-talos-ai-checkout.xml":        "Talos AI Checkout",
              "report-talos-ai-product-detail.xml":  "Talos AI Product Detail",
          }
          suites = {}
          for path in sorted(glob.glob("report-*.xml")):
              label = labels.get(path, path)
              try:
                  root = ET.parse(path).getroot()
                  suite_nodes = root.findall("testsuite") if root.tag == "testsuites" else [root]
                  total = failures = skipped = errors = 0
                  names = []
                  for s in suite_nodes:
                      total    += int(s.get("tests",    0))
                      failures += int(s.get("failures", 0))
                      skipped  += int(s.get("skipped",  0))
                      errors   += int(s.get("errors",   0))
                      f = int(s.get("failures", 0)) + int(s.get("errors", 0))
                      if f == 0:
                          f = sum(1 for tc in s if tc.find("failure") is not None or tc.find("error") is not None)
                      if f > 0:
                          n = s.get("name", "").strip()
                          if n:
                              names.append(n)
                  if total == 0:
                      total    = sum(1 for _ in root.iter("testcase"))
                      failures = sum(1 for tc in root.iter("testcase") if tc.find("failure") is not None)
                      errors   = sum(1 for tc in root.iter("testcase") if tc.find("error")   is not None)
                  suites[label] = {
                      "passed": total - failures - skipped - errors,
                      "failed": failures + errors,
                      "skipped": skipped,
                      "failed_tests": names,
                  }
              except Exception:
                  pass
          # A suite enabled this run but missing its report (crashed/hung, never
          # written) must still get a 'suites' entry — otherwise the daily
          # summary's merge sees no label for it at all and can't count the
          # failure (TALOS Talos AI iOS checkout silent-success incident, 2026-11-13).
          expected_reports = {
              "report-talos-ai-moments.xml":        os.environ.get("RUN_MOMENTS") == "true",
              "report-talos-ai-ama.xml":             os.environ.get("RUN_AMA") == "true",
              "report-talos-ai-checkout.xml":        os.environ.get("RUN_CHECKOUT") == "true",
              "report-talos-ai-product-detail.xml":  os.environ.get("RUN_PRODUCT_DETAIL") == "true",
          }
          for path, should_run in expected_reports.items():
              label = labels[path]
              if should_run and label not in suites:
                  suites[label] = {"passed": 0, "failed": 1, "skipped": 0, "failed_tests": ["Suite crashed or hung"]}
          # Per-suite breakdown lets the daily summary merge a partial rerun (e.g.
          # just the one suite that failed) with an earlier full run from today,
          # instead of the summary having to treat this run's data as the whole day.
          failed_tests = {label: e["failed_tests"] for label, e in suites.items() if e["failed_tests"]}
          data = {
              'result': os.environ.get('OUTCOME', 'failure'),
              'passed': int(os.environ.get('PASSED') or 0),
              'failed': int(os.environ.get('FAILED') or 0),
              'duration': os.environ.get('DURATION') or '—',
              'build_version': os.environ.get('BUILD_VERSION', ''),
              'run_url': os.environ.get('RUN_URL', ''),
              'failed_tests': failed_tests,
              'suites': suites,
          }
          with open('daily-results.json', 'w') as f:
              json.dump(data, f)
          PYEOF

      - name: Upload daily results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-results-maestro-talos-ai-ios-us
          path: daily-results.json
          if-no-files-found: warn
          retention-days: 2

      - name: Post-run cleanup
        if: always()
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          # Wipe this run's own simulator app-sandbox data (not a name-based
          # re-lookup — only the exact device this run just finished with).
          # Repeated CI installs otherwise accumulate in data/Containers
          # indefinitely (one device found at 160-200GB on a shared runner,
          # confirmed 2026-11-17). Device/UDID stays intact, only its data is reset.
          xcrun simctl erase "$SIMULATOR_UDID" || true
          rm -rf app/ report-*.xml maestro-*.txt ~/.maestro/tests/ ~/.maestro/tests-auth/ recordings/ recordings-tmp-*.mp4 job-start.txt moments-failed ama-failed checkout-failed product-detail-failed daily-results.json || true
