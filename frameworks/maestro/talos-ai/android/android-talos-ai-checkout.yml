appId: com.talos.app

# Runs regardless of pass/fail. Without this, a mid-flow assertion failure (e.g. the
# address guard, or losing the payment sheet) aborts before an order is ever placed,
# leaving a real item on this shared account's server-side bag — which then fails other
# suites that assume an empty bag at start.
onFlowComplete:
  - launchApp
  - waitForAnimationToEnd
  # Checkout's close button has no id — just an untagged "Back" button, except
  # under SHP_CXP_TALOS_AI_TAB_BAR_ON_BAG, which drops it for the persistent tab
  # bar — tap "Ask Go" there instead so cleanup can still reach talos-ai-exit.
  - runFlow:
      when:
        visible:
          id: "talos-ai-tab-bar-ask-go"
      commands:
        - tapOn:
            id: "talos-ai-tab-bar-ask-go"
        - waitForAnimationToEnd
  - runFlow:
      when:
        visible:
          text: "^Back$"
      commands:
        - tapOn:
            text: "^Back$"
        - waitForAnimationToEnd
  - runFlow:
      when:
        visible:
          id: "talos-ai-chat-input"
      commands:
        - runFlow: subflows/talos-ai-exit.yml
  - extendedWaitUntil:
      visible: "Search"
      timeout: 15000
      optional: true
  - runFlow: ../../android/subflows/clear-bag.yml
  - stopApp
---

# NOTE: This test taps the Add Payment Method button by testID="talos-ai-add-payment-button"
# on the NoPaymentRow Pressable in packages/talos-ai/pages/go/components/GoAIPaymentMethod.tsx,
# shipped in app-repo PR #21613 (merged 2026-05-27).

- launchApp
- waitForAnimationToEnd
# Relaunch can restore a slow-loading Talos AI screen; give it a few seconds to
# render before the exit guard checks, or the guard misses it and the flow
# ends up waiting on Home's "Search" text forever.
- extendedWaitUntil:
    visible:
      id: "talos-ai-address-button"
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible:
        id: "talos-ai-address-button"
    commands:
      - runFlow: subflows/talos-ai-exit.yml
- extendedWaitUntil:
    visible: "Search"
    timeout: 30000

- runFlow: subflows/talos-ai-launch.yml

# ── 1. Add to bag via natural language ────────────────────────────────────────
- tapOn:
    id: "talos-ai-chat-input"
- inputText: "Add one Basically water to my bag"
- hideKeyboard
- tapOn:
    id: "talos-ai-submit-button"
- extendedWaitUntil:
    visible:
      id: "stepper-check-pressable"
    timeout: 25000
- assertVisible:
    id: "stepper-check-pressable"

# ── 2. Open Talos AI checkout overlay ────────────────────────────────────────────
# "Checkout" (vs "Confirm Checkout") is the SHP_CXP_TALOS_AI_TAB_BAR_ON_BAG
# experiment's title when the tab bar stays visible on this screen — a 50/50
# split with no account override, so either can appear on a given run.
- tapOn:
    id: "talos-ai-tab-bar-bag"
- extendedWaitUntil:
    visible: "^(Confirm )?Checkout$"
    timeout: 10000
- assertVisible: "^(Confirm )?Checkout$"

# ── 3. Verify address, open payment sheet, select Pay with cash ───────────────
# Guard: never place an order to anything other than the fake Manley test address.
# The Talos AI checkout overlay renders the address as the talos-ai-address-button pill,
# whose accessibilityLabel is the street line only (selectedAddress.lineOne).
- assertVisible:
    id: "talos-ai-address-button"
    text: ".*12 Manley Hot Springs Rd.*"
- assertNotVisible:
    text: "(?i)pyrohova|vinnyts"

# The add-payment Pressable sits at the bottom of the BottomSheetScrollView,
# clipped by the sticky "Swipe to order" footer — scroll it clear before tapping.
- scrollUntilVisible:
    element:
      id: "talos-ai-add-payment-button"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "talos-ai-add-payment-button"
- waitForAnimationToEnd
# "Pay with cash" sits at the bottom of the payment-method sheet, below the fold on
# the 320x640 CI emulator — scroll to it rather than asserting it's already visible.
- scrollUntilVisible:
    element:
      text: "Pay with cash"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Pay with cash"
- waitForAnimationToEnd

# ── 4. Place order ────────────────────────────────────────────────────────────
# Prefix match, not exact — iOS's equivalent label coalesces with the sibling
# price text into "Swipe to order, $X.XX", which an exact match can't find
# (TALOS Talos AI iOS checkout failure, 2026-11-13); matched here too for parity.
- scrollUntilVisible:
    element:
      text: "(?i)^Swipe to order.*"
    direction: DOWN
# Anchored to the "Swipe to order" element rather than a fixed Y% — under
# SHP_CXP_TALOS_AI_TAB_BAR_ON_BAG the footer stacks above the persistent tab bar
# instead of sitting at the screen bottom, so a fixed Y% missed the slider.
# duration bumped to 1500 for parity with the iOS flow — a short/fast swipe on
# iOS reproducibly failed to register as a completed slide-to-confirm there
# (TALOS Talos AI iOS checkout failure, 2026-11-13; fix verified live on an iOS
# simulator), even though Android hasn't shown this failure yet.
- swipe:
    from:
      text: "(?i)^Swipe to order.*"
    direction: RIGHT
    duration: 1500
- waitForAnimationToEnd

# ── 5. Dismiss survey if it appears ──────────────────────────────────────────
- runFlow:
    when:
      visible:
        id: "DialogHeaderCloseButton"
    commands:
      - tapOn:
          id: "DialogHeaderCloseButton"
      - waitForAnimationToEnd

# ── 6. Dismiss tip modal if it appears ───────────────────────────────────────
- runFlow:
    when:
      visible:
        text: "Add a tip for your driver"
    commands:
      - tapOn:
          point: "50%,15%"
      - waitForAnimationToEnd

# ── 7. Wait for order progress screen ────────────────────────────────────────
# id matches either the legacy screen (OrderDetailsButton) or the new order-progress
# treatment currently in test (viewOrderButton).
- extendedWaitUntil:
    visible:
      id: "orderDetailsButton|viewOrderButton"
    timeout: 90000

- runFlow:
    when:
      visible:
        text: "Add a tip for your driver"
    commands:
      - tapOn:
          point: "50%,15%"
      - waitForAnimationToEnd

# ── 8. Cancel order ───────────────────────────────────────────────────────────
- tapOn:
    id: "orderDetailsButton|viewOrderButton"
- waitForAnimationToEnd
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 400
- waitForAnimationToEnd
- tapOn: "Help"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "(?i)cancel order"
    timeout: 10000
- tapOn:
    text: "(?i)cancel order"
- waitForAnimationToEnd
# "(?i)cancel.*(refund)" stopped being unique once the copy changed to "Cancel
# without refund": that text also matches the screen's own non-clickable
# heading, "Cancel order without a refund?", earlier in the hierarchy. Maestro
# tapped that heading instead of the button, silently going nowhere — the
# actual cause of every "order not cancelled" failure this session, verified
# live on a real device, 2026-11-15. Use the stable id instead, matching how
# ios-checkout.yml already confirms this same button via "DialogPrimaryAction".
- extendedWaitUntil:
    visible:
      id: "DialogPrimaryAction"
    timeout: 10000
- tapOn:
    id: "DialogPrimaryAction"
- extendedWaitUntil:
    visible:
      text: "Placed order by mistake"
    timeout: 30000
- tapOn:
    text: "Placed order by mistake"
- waitForAnimationToEnd
- tapOn:
    text: "Confirm"
- waitForAnimationToEnd

- stopApp
