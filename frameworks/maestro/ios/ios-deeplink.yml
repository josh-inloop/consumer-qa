appId: com.talos.app
---

# Login only if not already authenticated — avoids a redundant OTP when the auth session
# from the main suite login is still active (deeplinks runs before guest in CI).
- launchApp
- runFlow:
    when:
      visible:
        id: "PhoneInput"
    commands:
      - runFlow: subflows/login.yml

# ── 1: Custom scheme → Home ───────────────────────────────────────────────

# Cold
- stopApp
- openLink: "talos://open/"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "AddressBarAddressName"
    timeout: 15000
- assertVisible:
    id: "AddressBarAddressName"
- assertVisible:
    id: "ProductCollectionHeader"

# Warm
- launchApp
- openLink: "talos://open/"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "AddressBarAddressName"
    timeout: 15000
- assertVisible:
    id: "AddressBarAddressName"
- assertVisible:
    id: "ProductCollectionHeader"

# ── 2: Universal link → Snacks category ───────────────────────────────────

# Cold
- stopApp
- openLink: "https://link.talos.app/snacks"
- extendedWaitUntil:
    visible:
      id: "ProductTileImage"
    timeout: 20000
- assertVisible:
    id: "ProductTileImage"

# Warm
- launchApp
- openLink: "https://link.talos.app/snacks"
- extendedWaitUntil:
    visible:
      id: "ProductTileImage"
    timeout: 20000
- assertVisible:
    id: "ProductTileImage"

