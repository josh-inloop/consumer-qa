appId: com.talos.app

# Runs regardless of pass/fail. Without this, a mid-flow assertion failure (e.g. the map
# screenshot check, the address guard, or the driver-tip check) aborts before an order is
# ever placed, leaving a real item on this shared account's server-side bag — which then
# fails other suites that assume an empty bag at start.
onFlowComplete:
  - launchApp
  - extendedWaitUntil:
      visible:
        id: "swipableAdvertisement_close"
      timeout: 12000
      optional: true
  - runFlow: subflows/dismiss-home-modals.yml
  - extendedWaitUntil:
      visible: "Search"
      timeout: 30000
      optional: true
  - runFlow: subflows/clear-bag.yml
  - stopApp
---

# Relaunch app — account ends with stopApp, user is still logged in
- launchApp
- extendedWaitUntil:
    visible:
      id: "swipableAdvertisement_close"
    timeout: 12000
    optional: true
- runFlow: subflows/dismiss-home-modals.yml
- extendedWaitUntil:
    visible: "Search"
    timeout: 30000
- runFlow: subflows/clear-bag.yml

# Deep-link directly to the pinned PDP — bypasses search ranking, OOS substitution
# (e.g., listerine yielding only OOS variants), and Mix & Match upsells from
# unrelated SKUs. PDP_URL is per-market (mirrors Playwright's URL_PDP pin).
- openLink: "${PDP_URL}"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
# Exact match on the literal button text ("Add to Bag" / "Update Bag"), not a
# loose "starts with add/update, ends with bag" pattern — that looser form also
# matched a Similar Products carousel stepper's accessibility label ("Add
# Monster Ultra, 500ml to bag"), causing the test to tap the wrong element
# (TALOS Android UK checkout failure, 2026-11-13).
- extendedWaitUntil:
    visible:
      text: "(?i)^(add to bag|update bag)$"
    timeout: 30000
# Tap unconditionally — extendedWaitUntil already confirmed visibility; avoids
# the race where a runFlow `when` re-check races against PDP state changes.
- tapOn:
    text: "(?i)^(add to bag|update bag)$"
- waitForAnimationToEnd

# The bottom button flips "Add to Bag" -> "My Bag" once the item is added. Wait for
# that flip — it confirms the add succeeded and gives us the navigation target — then
# tap the "My Bag" *text* to go to the bag. Tap by text, not the MyBagButton id: that
# id is a clickable=false container overlapping the button whose tap doesn't reliably
# register navigation, whereas this text-tap mechanism already works for "Add to Bag".
- extendedWaitUntil:
    visible:
      text: "My Bag"
    timeout: 15000
- tapOn:
    text: "My Bag"
- waitForAnimationToEnd

# Dismiss product swap suggestion modal if it appears
- runFlow:
    when:
      visible:
        text: "Leave it"
    commands:
      - tapOn:
          text: "Leave it"
      - waitForAnimationToEnd

# Fail fast if nothing was added (e.g. OOS product showed Check Availability)
- assertNotVisible: "Your bag is empty"

# Scroll to and tap Checkout button
- scrollUntilVisible:
    element:
      id: "Checkout_Button"
    direction: DOWN
- tapOn:
    id: "Checkout_Button"
- waitForAnimationToEnd

# Decline FAM modal if it appears
- runFlow:
    when:
      visible:
        id: "DialogHeaderCloseButton_icon"
    commands:
      - tapOn:
          id: "DialogHeaderCloseButton_icon"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "No thanks, I don't want the savings"
    commands:
      - tapOn:
          text: "No thanks, I don't want the savings"
      - waitForAnimationToEnd

# The Checkout Aisle — continue if the interstitial appears
- runFlow:
    when:
      visible:
        text: "Continue to Checkout"
    commands:
      - tapOn:
          text: "Continue to Checkout"
      - waitForAnimationToEnd

# Verify checkout screen is ready
- extendedWaitUntil:
    visible:
      id: "PlaceOrderButton"
    timeout: 30000

# Verify the map thumbnail rendered (US only — the reference image is captured at the US
# test address, so it doesn't apply to UK's checkout screen).
#
# Reference recaptured 2026-11-05 at the Pixel 7 resolution (1080x2400) after the emulator
# screen-size pin — the prior reference was captured on the old 320x640 default and no
# longer matches. Threshold kept at 40 (originally lowered from 80 on 2026-09-10, TALOS run
# 34440645116: the map can render zoomed further out than the reference, a legitimate
# framing difference, not a flake). The check's actual job is only to catch a blank map
# (the historical bug this replaced an accessibility check for, ~2.7% similarity), so 40
# keeps a wide margin above blank while tolerating framing drift.
- runFlow:
    when:
      true: ${MARKET != 'UK'}
    commands:
      - assertScreenshot:
          path: "screenshots/checkout-map-reference.png"
          cropOn:
            id: "Map"
          thresholdPercentage: 40
          label: "Verify map thumbnail actually rendered (not blank)"

# The checkout payment icon row (Google Pay/PayPal/CashApp) can't be regression-tested here:
# each icon is a bare PaymentIcon SVG with no testID or accessibility label (confirmed via a
# CI hierarchy dump, packages/design-system/payment-icons/components/PaymentIcon.tsx), so
# there is no text or id for Maestro to select per payment method. The row's only selector is
# the FlatList container itself (testID "payment icons"), which only confirms some icons
# rendered, not which ones. The regression check for TALOS-122178 lives in android-account.yml
# instead, on the Payments page, where each method is a separately labeled row.

# Open payment selection
- scrollUntilVisible:
    element:
      id: "PaymentSelection_Button"
    direction: DOWN
- tapOn:
    id: "PaymentSelection_Button"
- waitForAnimationToEnd

# Select Pay with cash
- scrollUntilVisible:
    element:
      id: "PayWithCashButton--heading"
    direction: DOWN
- tapOn:
    id: "PayWithCashButton--heading"
- waitForAnimationToEnd

# Confirm payment dialog if it appears
- runFlow:
    when:
      visible:
        id: "DialogPrimaryAction"
    commands:
      - tapOn:
          id: "DialogPrimaryAction"
      - waitForAnimationToEnd

# Wait for checkout page to return
- extendedWaitUntil:
    visible:
      id: "PlaceOrderButton"
    timeout: 15000

# Guard: never place an order to anything other than the per-market fake address.
# DELIVERY_ADDRESS is set by the workflow (Manley/Alaska for US, Shetland/UK for UK).
# If the saved primary on the account drifts (e.g. Vinnytsia/Pyrohova reappears),
# fail loudly here instead of shipping a real fake order to the wrong MFC.
- assertVisible:
    id: "AddressSeciton_DescriptionText"
- assertVisible: "(?i).*${DELIVERY_ADDRESS_DESCRIPTION}.*"
- assertNotVisible:
    text: "(?i)pyrohova|vinnyts"

# Verify the driver-tip section renders. Tips returned to the checkout page after
# the post-order tip experiment was removed; this guards the section disappearing.
# Doesn't verify which tip is selected by default — that would require an
# accessibility `selected` prop the component doesn't currently emit.
- scrollUntilVisible:
    element:
      id: "DriverTip"
    direction: DOWN
- assertVisible:
    id: "DriverTip"

# Place the order
- scrollUntilVisible:
    element:
      id: "PlaceOrderButton"
    direction: DOWN
- tapOn:
    id: "PlaceOrderButton"
- waitForAnimationToEnd

# Wait for order progress screen.
# id matches either the legacy screen (OrderDetailsButton) or the new order-progress
# treatment currently in test (viewOrderButton).
- extendedWaitUntil:
    visible:
      id: "orderDetailsButton|viewOrderButton"
    timeout: 90000

# Tap Order details to open the order summary sheet
- tapOn:
    id: "orderDetailsButton|viewOrderButton"
- waitForAnimationToEnd

- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 400
- waitForAnimationToEnd
- swipe:
    start: "50%,70%"
    end: "50%,30%"
    duration: 400
- waitForAnimationToEnd
- tapOn: "Help"
- waitForAnimationToEnd

# Tap Cancel Order
- extendedWaitUntil:
    visible:
      text: "(?i)cancel order"
    timeout: 10000
- tapOn:
    text: "(?i)cancel order"
- waitForAnimationToEnd

# Wait for cancellation screen then confirm without refund. The sheet loads remote
# content (shows a spinner first), so give it 30s — 10s timed out mid-load.
#
# "(?i)cancel.*(refund)" stopped being unique once the copy changed to "Cancel
# without refund": that text also matches the screen's own non-clickable
# heading, "Cancel order without a refund?", earlier in the hierarchy. Maestro
# tapped that heading instead of the button, silently going nowhere — the
# actual cause of every "order not cancelled" failure this session, verified
# live on a real device, 2026-11-15. Use the stable id instead, matching how
# ios-checkout.yml already confirms this same button via "DialogPrimaryAction".
- extendedWaitUntil:
    visible:
      id: "DialogPrimaryAction"
    timeout: 30000
- tapOn:
    id: "DialogPrimaryAction"

# Select first cancellation reason and confirm
- extendedWaitUntil:
    visible:
      text: "Placed order by mistake"
    timeout: 30000
- tapOn:
    text: "Placed order by mistake"
- waitForAnimationToEnd
- tapOn:
    text: "Confirm"
- waitForAnimationToEnd

- stopApp
