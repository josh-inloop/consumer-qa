appId: com.talos.app
---
# Navigates from home to Talos AI and waits for Moments to load.
# Caller must have the app running on the home screen before invoking this subflow.
- tapOn:
    id: "homeTab"
- waitForAnimationToEnd

- runFlow: ../../../android/subflows/dismiss-home-modals.yml

- runFlow: ../../../android/subflows/clear-bag.yml

- tapOn:
    id: "talos-ai-nav-button"

- extendedWaitUntil:
    visible:
      id: "talos-ai-address-button"
    timeout: 20000
